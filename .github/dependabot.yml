# Code scanning runs through GitHub's default setup, configured under
# Settings, Code security. There is no CodeQL workflow in this repository:
# a default setup and an advanced workflow cannot coexist, and the default
# one needs no maintenance.

version: 2

updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
